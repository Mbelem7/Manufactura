{% with messages = get_flashed_messages(with_categories=true) %}

    {% if messages %}

        <div class="mb-4">

            {% for category, message in messages %}

                <div
                    class="alert alert-{{ category }} alert-dismissible fade show"
                    role="alert"
                >
                    {{ message }}

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        aria-label="Cerrar"
                    ></button>
                </div>

            {% endfor %}

        </div>

    {% endif %}

{% endwith %}
