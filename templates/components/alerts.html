{% with messages = get_flashed_messages(with_categories=true) %}

    {% set clases = {'exito': 'success', 'error': 'danger'} %}

    {% if messages %}

        <div class="mb-4">

            {% for category, message in messages %}

                <div
                    class="alert alert-{{ clases.get(category, category) }} alert-dismissible fade show"
                    role="alert"
                >
                    {{ message }}

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        aria-label="Cerrar"
                    ></button>
                </div>

            {% endfor %}

        </div>

    {% endif %}

{% endwith %}
