{% extends "layouts/base.html" %}

{% block title %}
Nueva orden de producción | Manufactura
{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1 class="page-title">
            Nueva orden de producción
        </h1>

        <p class="page-description">
            Registra una orden para la fabricación de un producto.
        </p>
    </div>

</div>


<form method="POST">

    <div class="app-card mb-4">

        <div class="p-4">

            <h5 class="mb-4">
                Información general
            </h5>

            <div class="row g-3">

                <div class="col-md-6">

                    <label
                        for="producto_id"
                        class="form-label"
                    >
                        Producto
                    </label>

                    <select
                        id="producto_id"
                        name="producto_id"
                        class="form-select"
                        required
                    >
                        <option value="">
                            Seleccione un producto
                        </option>
                    </select>

                </div>


                <div class="col-md-6">

                    <label
                        for="bom_id"
                        class="form-label"
                    >
                        Lista de materiales
                    </label>

                    <select
                        id="bom_id"
                        name="bom_id"
                        class="form-select"
                        required
                    >
                        <option value="">
                            Seleccione una BOM
                        </option>
                    </select>

                </div>


                <div class="col-md-4">

                    <label
                        for="lote_id"
                        class="form-label"
                    >
                        Lote
                    </label>

                    <select
                        id="lote_id"
                        name="lote_id"
                        class="form-select"
                        required
                    >
                        <option value="">
                            Seleccione un lote
                        </option>
                    </select>

                </div>


                <div class="col-md-4">

                    <label
                        for="cantidad"
                        class="form-label"
                    >
                        Cantidad
                    </label>

                    <input
                        type="number"
                        id="cantidad"
                        name="cantidad"
                        class="form-control"
                        min="0.01"
                        step="0.01"
                        placeholder="0.00"
                        required
                    >

                </div>


                <div class="col-md-4">

                    <label
                        for="estado"
                        class="form-label"
                    >
                        Estado
                    </label>

                    <input
                        type="text"
                        id="estado"
                        name="estado"
                        class="form-control"
                        placeholder="Estado"
                        required
                    >

                </div>

            </div>

        </div>

    </div>


    <div class="d-flex justify-content-end gap-2 mb-4">

        <a
            href="{{ url_for('produccion.ordenes') }}"
            class="btn btn-light"
        >
            Cancelar
        </a>

        <button
            type="submit"
            class="btn btn-primary"
        >
            <i class="bi bi-check-lg me-1"></i>
            Guardar orden
        </button>

    </div>

</form>

{% endblock %}
