{% extends "layouts/base.html" %}

{% block title %}
Nueva ejecución de producción | Manufactura
{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1 class="page-title">
            Nueva ejecución de producción
        </h1>

        <p class="page-description">
            Registra el resultado real de una orden de producción.
        </p>
    </div>

</div>


<form method="POST">

    <div class="app-card mb-4">

        <div class="p-4">

            <h5 class="mb-4">
                Información de la ejecución
            </h5>

            <div class="row g-3">

                <div class="col-md-6">

                    <label
                        for="ordenp_id"
                        class="form-label"
                    >
                        Orden de producción
                    </label>

                    <select
                        id="ordenp_id"
                        name="ordenp_id"
                        class="form-select"
                        required
                    >
                        <option value="">
                            Seleccione una orden de producción
                        </option>
                    </select>

                </div>


                <div class="col-md-6">

                    <label
                        for="usuario_id"
                        class="form-label"
                    >
                        Usuario responsable
                    </label>

                    <select
                        id="usuario_id"
                        name="usuario_id"
                        class="form-select"
                        required
                    >
                        <option value="">
                            Seleccione un usuario
                        </option>
                    </select>

                </div>


                <div class="col-md-6">

                    <label
                        for="fecha_inicio"
                        class="form-label"
                    >
                        Fecha de inicio
                    </label>

                    <input
                        type="datetime-local"
                        id="fecha_inicio"
                        name="fecha_inicio"
                        class="form-control"
                        required
                    >

                </div>


                <div class="col-md-6">

                    <label
                        for="fecha_fin"
                        class="form-label"
                    >
                        Fecha de finalización
                    </label>

                    <input
                        type="datetime-local"
                        id="fecha_fin"
                        name="fecha_fin"
                        class="form-control"
                    >

                </div>


                <div class="col-md-6">

                    <label
                        for="cantidad_aceptada"
                        class="form-label"
                    >
                        Cantidad aceptada
                    </label>

                    <input
                        type="number"
                        id="cantidad_aceptada"
                        name="cantidad_aceptada"
                        class="form-control"
                        min="0"
                        step="0.01"
                        placeholder="0.00"
                        required
                    >

                </div>


                <div class="col-md-6">

                    <label
                        for="cantidad_rechazada"
                        class="form-label"
                    >
                        Cantidad rechazada
                    </label>

                    <input
                        type="number"
                        id="cantidad_rechazada"
                        name="cantidad_rechazada"
                        class="form-control"
                        min="0"
                        step="0.01"
                        placeholder="0.00"
                        required
                    >

                </div>

            </div>

        </div>

    </div>


    <div class="d-flex justify-content-end gap-2 mb-4">

        <a
            href="{{ url_for('produccion.ejecuciones') }}"
            class="btn btn-light"
        >
            Cancelar
        </a>

        <button
            type="submit"
            class="btn btn-primary"
        >
            <i class="bi bi-check-lg me-1"></i>
            Guardar ejecución
        </button>

    </div>

</form>

{% endblock %}
