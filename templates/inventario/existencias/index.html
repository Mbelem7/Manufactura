{% extends "layouts/base.html" %}

{% block title %}
Existencias | Manufactura
{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1 class="page-title">
            Existencias
        </h1>

        <p class="page-description">
            Consulta las cantidades disponibles por producto, almacén y lote.
        </p>
    </div>

</div>


<div class="app-card">

    <div class="p-3 border-bottom">

        <div class="row g-3">

            <div class="col-md-5">

                <div class="input-group">

                    <span class="input-group-text bg-white">
                        <i class="bi bi-search"></i>
                    </span>

                    <input
                        type="search"
                        class="form-control"
                        placeholder="Buscar por producto o lote..."
                    >

                </div>

            </div>


            <div class="col-md-3">

                <select class="form-select">

                    <option value="">
                        Todos los almacenes
                    </option>

                </select>

            </div>


            <div class="col-md-4">

                <select class="form-select">

                    <option value="">
                        Todos los productos
                    </option>

                </select>

            </div>

        </div>

    </div>


    <div class="table-responsive">

        <table class="table align-middle mb-0">

            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Almacén</th>
                    <th>Lote</th>
                    <th class="text-end">
                        Cantidad
                    </th>
                </tr>
            </thead>

            <tbody>

                <tr>

                    <td colspan="4">

                        <div class="text-center py-5 text-muted">

                            <i class="bi bi-boxes fs-2 d-block mb-2"></i>

                            No hay existencias registradas.

                        </div>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

{% endblock %}
