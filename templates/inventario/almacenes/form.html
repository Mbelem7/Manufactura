{% extends "layouts/base.html" %}

{% block title %}
Nuevo almacén | Manufactura
{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1 class="page-title">
            Nuevo almacén
        </h1>

        <p class="page-description">
            Registra una nueva ubicación de almacenamiento.
        </p>
    </div>

</div>


<form method="POST">

    <div class="app-card mb-4">

        <div class="p-4">

            <h5 class="mb-4">
                Información general
            </h5>


            <div class="row g-3">

                <div class="col-md-4">

                    <label
                        for="codigo"
                        class="form-label"
                    >
                        Código
                    </label>

                    <input
                        type="text"
                        id="codigo"
                        name="codigo"
                        class="form-control"
                        placeholder="Ej. ALM-001"
                        required
                    >

                </div>


                <div class="col-md-8">

                    <label
                        for="nombre"
                        class="form-label"
                    >
                        Nombre
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        class="form-control"
                        placeholder="Ej. Almacén principal"
                        required
                    >

                </div>


                <div class="col-md-4">

                    <label
                        for="tipo"
                        class="form-label"
                    >
                        Tipo
                    </label>

                    <input
                        type="text"
                        id="tipo"
                        name="tipo"
                        class="form-control"
                        placeholder="Ej. Materia prima"
                        required
                    >

                </div>


                <div class="col-md-5">

                    <label
                        for="ubicacion"
                        class="form-label"
                    >
                        Ubicación
                    </label>

                    <input
                        type="text"
                        id="ubicacion"
                        name="ubicacion"
                        class="form-control"
                        placeholder="Ej. Planta principal"
                    >

                </div>


                <div class="col-md-3">

                    <label
                        for="estado"
                        class="form-label"
                    >
                        Estado
                    </label>

                    <input
                        type="text"
                        id="estado"
                        name="estado"
                        class="form-control"
                        placeholder="Estado"
                        required
                    >

                </div>

            </div>

        </div>

    </div>


    <div class="d-flex justify-content-end gap-2 mb-4">

        <a
            href="{{ url_for('inventario.almacenes') }}"
            class="btn btn-light"
        >
            Cancelar
        </a>

        <button
            type="submit"
            class="btn btn-primary"
        >
            <i class="bi bi-check-lg me-1"></i>
            Guardar almacén
        </button>

    </div>

</form>

{% endblock %}
